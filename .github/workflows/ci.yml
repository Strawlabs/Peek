name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Lint, Typecheck, Test, Build (React Frontend)
  # ──────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc -b --noEmit

      - name: Unit & integration tests
        run: npx vitest run --reporter=verbose
        env:
          # Provide dummy Supabase env vars so the client initializes
          # without leaking real keys. Tests do not hit the real API.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder

      - name: Verify build output exists
        run: |
          test -f dist/index.html || (echo "❌ dist/index.html missing" && exit 1)
          echo "✅ Build output verified"

  # ──────────────────────────────────────────────────────────────
  # Job 2: Supabase Validation (Config, Migrations, Edge Functions)
  # ──────────────────────────────────────────────────────────────
  supabase-validate:
    name: Supabase — Config & Migration Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate supabase/config.toml
        run: |
          echo "Checking config.toml exists and is valid..."
          test -f supabase/config.toml || (echo "❌ supabase/config.toml not found" && exit 1)
          echo "✅ supabase/config.toml present"

      - name: Validate migration files
        run: |
          echo "Checking migration files..."
          MIGRATION_COUNT=$(ls supabase/migrations/*.sql 2>/dev/null | wc -l)
          echo "Found $MIGRATION_COUNT migration file(s)"
          if [ "$MIGRATION_COUNT" -eq 0 ]; then
            echo "⚠️  No migration files found"
          else
            echo "✅ Migration files present"
            # Validate SQL syntax (basic check)
            for f in supabase/migrations/*.sql; do
              echo "  Checking: $f"
              # Ensure file is non-empty and contains at least one SQL statement
              if [ ! -s "$f" ]; then
                echo "  ❌ $f is empty" && exit 1
              fi
            done
            echo "✅ All migration files are non-empty"
          fi

      - name: Validate Edge Functions structure
        run: |
          echo "Checking Edge Functions..."
          for dir in supabase/functions/*/; do
            if [ -f "$dir/index.ts" ]; then
              echo "  ✅ $(basename $dir)/index.ts exists"
            else
              echo "  ❌ $(basename $dir)/index.ts missing" && exit 1
            fi
          done
          echo "✅ All Edge Functions have entry points"

  # ──────────────────────────────────────────────────────────────
  # Job 3: Security Audit (No Hardcoded Secrets)
  # ──────────────────────────────────────────────────────────────
  security:
    name: Security — Secret Leak Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan for hardcoded secrets in source code
        run: |
          echo "Scanning for hardcoded Supabase keys in source files..."
          # Check that src/ files do not contain hardcoded Supabase URLs or keys
          # (they should use import.meta.env instead)
          VIOLATIONS=""
          if grep -rn "supabase\.co" src/ --include="*.ts" --include="*.tsx" | grep -v "import.meta.env" | grep -v "placeholder" | grep -v "\.test\." | grep -v "setup\.ts"; then
            VIOLATIONS="$VIOLATIONS\n  Found hardcoded Supabase URL in src/"
          fi
          if grep -rn "eyJhbG" src/ --include="*.ts" --include="*.tsx" | grep -v "import.meta.env" | grep -v "placeholder" | grep -v "\.test\." | grep -v "setup\.ts"; then
            VIOLATIONS="$VIOLATIONS\n  Found hardcoded JWT/anon key in src/"
          fi
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ Secret leak detected:$VIOLATIONS"
            exit 1
          fi
          echo "✅ No hardcoded secrets found in source files"

      - name: Verify .env files are gitignored
        run: |
          echo "Checking .gitignore rules..."
          if grep -q "\.env" .gitignore; then
            echo "✅ .env files are gitignored"
          else
            echo "❌ .env is NOT in .gitignore — secrets may leak!" && exit 1
          fi

      - name: Verify no .env files are tracked
        run: |
          TRACKED=$(git ls-files '*.env' '.env.*' '*.env.local' 2>/dev/null || true)
          if [ -n "$TRACKED" ]; then
            echo "❌ Environment files are tracked in git: $TRACKED"
            exit 1
          fi
          echo "✅ No .env files tracked in git"
